name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Check release version contract
        run: python scripts/check_release_version.py
      - name: Run test suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check generated API client
        run: python scripts/generate_api_client.py --check
      - name: Compile Python sources
        run: python -m compileall -q room_alignment scripts tests
      - name: Check browser JavaScript syntax
        run: |
          node --check web/api-client.js
          node --check web/app.js

  package:
    name: Build and verify package
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: [self-hosted, macOS, ARM64, room-alignment]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.6"
          enable-cache: false
      - name: Check release version contract
        run: python scripts/check_release_version.py
      - name: Build wheel and source archive
        run: uv build --out-dir dist
      - name: Verify pre-provisioned media tools
        run: |
          command -v ffmpeg
          command -v ffprobe
      - name: Verify clean wheel install and runtime
        shell: bash
        run: |
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python scripts/verify_package.py "${wheels[0]}"
      - name: Retain package candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: room-alignment-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
