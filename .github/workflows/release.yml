name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Run supported-runtime checks
        run: |
          python scripts/check_release_version.py
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/generate_api_client.py --check
          python -m compileall -q room_alignment scripts tests
          node --check web/api-client.js
          node --check web/app.js

  build:
    name: Build and verify release artifacts
    needs: quality
    runs-on: [self-hosted, macOS, ARM64, room-alignment]
    outputs:
      commit_sha: ${{ steps.release-identity.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pre-provisioned build tools
        run: |
          command -v python3.11
          command -v node
          command -v uv
          uv --version | grep -F 'uv 0.12.6'
      - name: Record release identity
        id: release-identity
        run: echo "commit_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Validate release tag and version
        run: python3.11 scripts/check_release_version.py
      - name: Verify pre-provisioned media tools
        run: |
          command -v ffmpeg
          command -v ffprobe
      - name: Run source checks
        run: |
          python3.11 -m unittest discover -s tests -p 'test_*.py' -v
          python3.11 scripts/generate_api_client.py --check
          python3.11 -m compileall -q room_alignment scripts tests
          node --check web/api-client.js
          node --check web/app.js
      - name: Build wheel and source archive
        run: uv build --out-dir dist
      - name: Verify clean wheel install and runtime
        shell: bash
        run: |
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python3.11 scripts/verify_package.py "${wheels[0]}"
      - name: Create checksums
        working-directory: dist
        run: shasum -a 256 ./* > SHA256SUMS
      - name: Retain verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified artifacts
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required only to create the GitHub release for this tag.
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.ref_name }}
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT_SHA: ${{ needs.build.outputs.commit_sha }}
        run: |
          object_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")"
          object_type="$(jq -r '.object.type' <<<"$object_json")"
          object_sha="$(jq -r '.object.sha' <<<"$object_json")"
          while [ "$object_type" = "tag" ]; do
            object_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
            object_type="$(jq -r '.object.type' <<<"$object_json")"
            object_sha="$(jq -r '.object.sha' <<<"$object_json")"
          done
          test "$object_type" = "commit"
          test "$object_sha" = "$EXPECTED_COMMIT_SHA"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Room Alignment $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
