name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  publish:
    name: Build, verify, and publish
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.6"
          enable-cache: false
      - name: Validate release tag and version
        run: python scripts/check_release_version.py
      - name: Run source checks
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/generate_api_client.py --check
          python -m compileall -q room_alignment scripts tests
          node --check web/api-client.js
          node --check web/app.js
      - name: Build wheel and source archive
        run: uv build --out-dir dist
      - name: Install required media tools
        run: brew install ffmpeg
      - name: Verify clean wheel install and runtime
        shell: bash
        run: |
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python scripts/verify_package.py "${wheels[0]}"
      - name: Create checksums
        working-directory: dist
        run: shasum -a 256 * > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Room Alignment $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
